name: Capture and replay regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --include=optional
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture and replay regression suites
        run: npm run test:capture-replay
      - name: Build web application
        run: npm run build
